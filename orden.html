<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <link rel="stylesheet" href="w3.css">
    <link rel="stylesheet" href="mycss.css">
    <style>
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }

        .btn {
            padding: 12px 24px;
            font-size: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-off {
            background-color: #f44336;
            color: white;
        }

        .btn-off:hover {
            background-color: #da190b;
        }

        .btn-reboot {
            background-color: #ff9800;
            color: white;
        }

        .btn-reboot:hover {
            background-color: #e68900;
        }

        .btn-refresca {
            background-color: #17e600;
            color: white;
        }

        .btn-refresca:hover {
            background-color: #17e600;
        }

        .btn-wol {
            background-color: #002ae6;
            color: white;
        }

        .btn-wol:hover {
            background-color: #002ae6;
        }

    </style>
</head>

<body>
    <div class="w3-container w3-center">
        <h1>Panel de Control</h1>

        <div class="button-container">
            <div class="">
                <p class="w3-text-gray">Refresca el servidor</p>
                <button class="btn btn-refresca" onclick="ejecutar('refresca.php')">Refrescar</button>

                <p class="w3-text-gray">Reinicia el servidor</p>
                <button class="btn btn-reboot" onclick="ejecutar('reboot.php')">Reiniciar</button>

                <p class="w3-text-gray">Apaga el servidor</p>
                <button class="btn btn-off" onclick="ejecutar('poweroff.php')">Apagar</button>

                <p class="w3-text-gray">Inicia el servidor cubipc</p>
                <button class="btn btn-wol" onclick="ejecutar('wol_cubipc.php')">wol cubipc</button>

                <p class="w3-text-gray">Inicia el servidor newpc</p>
                <button class="btn btn-wol" onclick="ejecutar('wol_newpc.php')">wol newpc</button>

                <p class="w3-text-gray">Inicia el servidor wolpc</p>
                <button class="btn btn-wol" onclick="ejecutar('wol_wolpc.php')">wol wolpc</button>

            </div>
        </div>

        <div id="status" class="w3-text-gray"></div>
    </div>

    <script>
        function ejecutar(comando) {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', comando, true);
            xhr.onload = function () {
                if (xhr.status === 200) {
                    document.getElementById('status').innerHTML = 'Comando: ' + comando + ' - Ejecutado';
                } else {
                    document.getElementById('status').innerHTML = 'Error al ejecutar comando';
                }
            };
            xhr.send();
        }
    </script>
</body>

</html>
